services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: accounting-app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: accounting-mysql
    # Philippine time, like the live server, so "date entered" is correct.
    command: --default-time-zone=+08:00
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: accounting
      MYSQL_USER: accounting
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  node:
    image: node:20-alpine
    container_name: accounting-node
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run build"
    profiles: ["build"]

volumes:
  mysql-data:
